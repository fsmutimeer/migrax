name: Security scan

# Checks the libraries the POMs name and the JDBC drivers in the container image against the
# OSV vulnerability database. New advisories appear without any change here, so it also runs
# every week. It fails only on what users get (SHIPPED and COMPILE); PROVIDED findings are
# listed for the next release. Pushes run it only when dependencies change, so a new advisory
# shows up in the weekly run instead of failing unrelated work.
on:
  push:
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'chore/**', 'ci/**', 'test/**',
      'release/**', 'hotfix/**']
    paths:
      - '**/pom.xml'
      - 'docker/**'
      - 'Dockerfile'
      - 'scripts/security-scan.py'
      - '.github/workflows/security.yml'
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # Writes the flattened POMs the scanner reads, and the jar the image needs.
      - run: mvn -B install -DskipTests -Dspotbugs.skip=true
      - run: mvn -B install -DskipTests -f integrations/pom.xml
      - name: Build the container image
        run: |
          VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          docker build --build-arg VERSION="$VERSION" -t migrax:scan .
      - run: python3 -I scripts/security-scan.py --image migrax:scan
