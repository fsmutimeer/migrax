name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write
  actions: write   # to start the docs workflow
  packages: write  # to publish the container image

jobs:
  release:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Check the tag matches the project version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          POM=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$VERSION" != "$POM" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pom.xml version $POM" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # Unit tests, SpotBugs, then the framework integrations against the core just built.
      - run: mvn -B install
      - run: mvn -B install -f integrations/pom.xml

      - name: Release notes from the changelog
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found && /^\[.*\]: http/ { next }
            found { print }' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi

      # The container image, before the release: if it can't be built, nothing is published.
      # Stable releases also move the 'latest' tag.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAGS="$IMAGE:$VERSION"
          if [[ "$VERSION" != *-* ]]; then TAGS="$TAGS,$IMAGE:latest"; fi
          echo "TAGS=$TAGS" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.TAGS }}
          build-args: VERSION=${{ env.VERSION }}

      - uses: softprops/action-gh-release@v2
        with:
          name: Migrax ${{ env.VERSION }}
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            target/migrax-${{ env.VERSION }}.zip
            target/migrax-${{ env.VERSION }}.jar
            integrations/spring-boot-starter/target/migrax-spring-boot-starter-${{ env.VERSION }}.jar
            integrations/quarkus/target/migrax-quarkus-${{ env.VERSION }}.jar
            integrations/micronaut/target/migrax-micronaut-${{ env.VERSION }}.jar
            integrations/helidon/target/migrax-helidon-${{ env.VERSION }}.jar
            integrations/gradle-plugin/target/migrax-gradle-plugin-${{ env.VERSION }}.jar

      # A release created with GITHUB_TOKEN does not trigger other workflows, so start the docs
      # build explicitly: it copies the new release files to the Download page.
      - name: Update the Download page
        run: gh workflow run docs.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
