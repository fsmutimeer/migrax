name: CI

on:
  push:
    # main, and work branches so they are tested before they are merged.
    branches: [main, 'feature/**', 'fix/**', 'refactor/**', 'chore/**', 'ci/**', 'test/**',
      'release/**', 'hotfix/**']
  pull_request:

jobs:
  build:
    name: Build and test (${{ matrix.os }}, Java ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: ['17', '21']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - if: runner.os != 'Windows'
        run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # Unit tests, H2 + Hibernate schema validation, and the SpotBugs gate.
      - run: mvn -B verify

      - name: Smoke test the installed CLI (POSIX)
        if: runner.os != 'Windows'
        run: |
          MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
          "$RUNNER_TEMP/bin/migrax" version
          "$RUNNER_TEMP/bin/migrax" help
      - name: Smoke test the installed CLI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File install.ps1 -InstallDir "$env:RUNNER_TEMP\migrax" -NoPathUpdate
          & "$env:RUNNER_TEMP\migrax\bin\migrax.cmd" version
          & "$env:RUNNER_TEMP\migrax\bin\migrax.cmd" help

  integrations:
    name: Spring Boot, Quarkus, Micronaut, Helidon, JUnit and Gradle integrations
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      # Real Spring Boot and Quarkus applications with Hibernate validating the migrated schema.
      - run: mvn -B install -f integrations/pom.xml
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Gradle plugin smoke test
        run: |
          P="$RUNNER_TEMP/shop"
          mkdir -p "$P/src/main/java/demo" "$P/src/main/resources"
          printf 'pluginManagement { repositories { mavenLocal(); gradlePluginPortal() } }\nrootProject.name = "shop"\n' > "$P/settings.gradle.kts"
          printf 'plugins { java; id("org.migrax") version "0.16.1-SNAPSHOT" }\ngroup = "demo"\nrepositories { mavenLocal(); mavenCentral() }\ndependencies { implementation("jakarta.persistence:jakarta.persistence-api:3.1.0"); runtimeOnly("com.h2database:h2:2.3.232") }\n' > "$P/build.gradle.kts"
          printf 'package demo;\nimport jakarta.persistence.*;\n@Entity public class Item { @Id @GeneratedValue Long id; String name; }\n' > "$P/src/main/java/demo/Item.java"
          printf 'spring.datasource.url=jdbc:h2:file:./data/db\n' > "$P/src/main/resources/application.properties"
          cd "$P" && gradle -q migraxGenerate migraxMigrate migraxStatus migraxVerify
          # The plugin packages .migrax/snapshot.json for migrax.drift.check at startup.
          gradle -q jar && unzip -l build/libs/shop.jar | grep -q "META-INF/migrax/snapshot.json"

  hibernate:
    name: Hibernate ${{ matrix.hibernate }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        # The newest patch of every minor version Migrax reads with Hibernate's own mapping.
        hibernate: [4.0.1.Final, 4.1.12.Final, 4.2.21.Final, 4.3.11.Final, 5.0.12.Final, 5.1.17.Final, 5.2.18.Final,
                    5.3.36.Final, 5.4.33.Final, 5.5.9.Final, 5.6.15.Final, 6.0.2.Final, 6.1.7.Final, 6.2.52.Final,
                    6.3.2.Final, 6.4.10.Final, 6.5.3.Final, 6.6.58.Final,
                    7.0.10.Final, 7.1.36.Final, 7.2.25.Final, 7.3.13.Final, 7.4.12.Final]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      - run: MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      # Generates, migrates and verifies a fixture with that Hibernate version validating it.
      - run: MIGRAX="$RUNNER_TEMP/bin/migrax" bash compat/hibernate/run.sh ${{ matrix.hibernate }}

  eclipselink:
    name: EclipseLink ${{ matrix.eclipselink }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        eclipselink: [2.7.15, 3.0.4, 4.0.4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      - run: MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      # Generates, migrates and verifies a fixture read through EclipseLink's mapping, then
      # EclipseLink itself saves and reads every kind of entity against the migrated database.
      - run: MIGRAX="$RUNNER_TEMP/bin/migrax" bash compat/eclipselink/run.sh ${{ matrix.eclipselink }}

  openjpa:
    name: OpenJPA ${{ matrix.openjpa }}
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        openjpa: [3.2.2, 4.1.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      - run: MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      # Generates, migrates and verifies a fixture read through OpenJPA's mapping, then OpenJPA
      # itself saves and reads every kind of entity against the migrated database.
      - run: MIGRAX="$RUNNER_TEMP/bin/migrax" bash compat/openjpa/run.sh ${{ matrix.openjpa }}

  spring-boot-starter:
    name: Spring Boot starter (Spring Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        boot: [3.0.13, 3.5.16, 4.1.1]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      - run: mvn -B install -DskipTests -f integrations/spring-boot-starter/pom.xml
      # A JPA application with the starter: Hibernate validates the migrated schema at startup,
      # and the migrax health component reports UP.
      - run: |
          export MIGRAX_COMPAT_STARTER_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          bash compat/spring-boot/run.sh ${{ matrix.boot }}

  micronaut-data:
    name: Micronaut Data (Micronaut ${{ matrix.micronaut }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - micronaut: 4.0.6
            java: '17'
          - micronaut: 4.10.22
            java: '21'
          # Micronaut 5 is compiled for Java 25, so Migrax runs on it too.
          - micronaut: 5.2.3
            java: '25'
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migrax
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # SpotBugs can't read Java 25 class files; the build job runs it.
      - run: mvn -B install -DskipTests -Dspotbugs.skip=true
      - run: mvn -B install -DskipTests -f integrations/micronaut/pom.xml
      # migrax-micronaut is compiled against the oldest Micronaut 4; its tests (health, metrics,
      # tracing, several databases) run here on this job's Micronaut.
      - run: >-
          mvn -B surefire:test -f integrations/micronaut/pom.xml
          -Dmicronaut.platform.version=${{ matrix.micronaut }}
      - run: MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      # Generates, migrates and verifies a fixture read through Micronaut Data's mapping on H2
      # and PostgreSQL, then Micronaut Data itself saves, loads and deletes its entities;
      # migrax-micronaut migrates a new database at startup.
      - run: |
          export MIGRAX_COMPAT_STARTUP_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          MIGRAX="$RUNNER_TEMP/bin/migrax" bash compat/micronaut-data/run.sh ${{ matrix.micronaut }}
        env:
          MIGRAX_COMPAT_PG_URL: jdbc:postgresql://localhost:5432/postgres
          MIGRAX_COMPAT_PG_USER: postgres
          MIGRAX_COMPAT_PG_PASSWORD: migrax

  spring-data-jdbc:
    name: Spring Data JDBC (Spring Boot ${{ matrix.boot }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        boot: [3.0.13, 3.2.12, 3.5.16, 4.1.1]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: migrax
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B install -DskipTests
      - run: mvn -B install -DskipTests -f integrations/spring-boot-starter/pom.xml
      - run: MIGRAX_INSTALL_DIR="$RUNNER_TEMP/migrax" MIGRAX_BIN_DIR="$RUNNER_TEMP/bin" sh install.sh
      # Generates, migrates and verifies a fixture read through Spring Data JDBC's mapping on H2
      # and PostgreSQL, then Spring Data JDBC itself saves, loads and deletes its aggregates; the
      # starter migrates a new database at startup.
      - run: |
          export MIGRAX_COMPAT_STARTER_VERSION="$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)"
          MIGRAX="$RUNNER_TEMP/bin/migrax" bash compat/spring-data-jdbc/run.sh ${{ matrix.boot }}
        env:
          MIGRAX_COMPAT_PG_URL: jdbc:postgresql://localhost:5432/postgres
          MIGRAX_COMPAT_PG_USER: postgres
          MIGRAX_COMPAT_PG_PASSWORD: migrax

  databases:
    name: Real databases (MySQL, MariaDB, PostgreSQL, SQL Server, Oracle, CockroachDB, SQLite)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # Runs the migration runner and applies generated migrations on each engine, then starts
      # Hibernate with schema validation against them.
      - run: mvn -B verify -Pdatabase-integration
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: database-integration-reports
          path: target/failsafe-reports/

  quarkus:
    name: Quarkus extension (current Quarkus, JVM and native)
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B -q install -DskipTests -Dspotbugs.skip=true
      - run: mvn -B -q install -DskipTests -f integrations/quarkus/pom.xml
      # A real application on a current Quarkus release, with Hibernate validating the schema:
      # it starts only if the migrations ran first. Each mode gets an empty database.
      - name: JVM mode
        run: DB_URL=jdbc:postgresql://localhost:5432/postgres bash compat/quarkus/run.sh jvm
      - name: Native executable
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE native"
          DB_URL=jdbc:postgresql://localhost:5432/native bash compat/quarkus/run.sh native

  jakarta-ee:
    name: Jakarta EE integration (WildFly, Payara)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B -q install -DskipTests -Dspotbugs.skip=true
      - run: mvn -B -q install -f integrations/jakarta-ee/pom.xml
      # The fixture WAR on real servers: the migrations must reach the server's own data source.
      - run: bash compat/jakarta-ee/run.sh wildfly
      - run: bash compat/jakarta-ee/run.sh payara

  action:
    name: GitHub Action with the HTML report
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # A service with entities and its first migration, as the action finds it in a repository.
      - name: Prepare a project
        run: |
          P="$RUNNER_TEMP/project"
          cp -r compat/hibernate/fixture "$P"
          sed -i 's/HIBERNATE_VERSION/7.2.25.Final/' "$P/pom.xml"
          mvn -B -q package -DskipTests -Dspotbugs.skip=true
          cd "$P"
          export MIGRAX_DATABASE_URL="jdbc:h2:file:$P/target/db" MIGRAX_DATABASE_USER=sa
          sh "$GITHUB_WORKSPACE/bin/migrax" generate --no-input
      - uses: ./
        with:
          working-directory: ${{ runner.temp }}/project
          comment: 'false'
      - name: Check the report
        run: |
          REPORT="$RUNNER_TEMP/migrax/migrax-report.html"
          grep -q 'erDiagram' "$REPORT"
          grep -q '0001_initial.sql' "$REPORT"
          grep -q 'No database URL is configured' "$REPORT"

  ci-templates:
    name: GitLab and Bitbucket script
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      # A merge request as ci/migrax-ci.sh finds it: the target branch on origin, and a branch
      # with a risky migration, then also an entity change without a migration.
      - name: Prepare a merge request
        run: |
          mvn -B -q package -DskipTests -Dspotbugs.skip=true
          P="$RUNNER_TEMP/project"
          cp -r compat/hibernate/fixture "$P"
          sed -i 's/HIBERNATE_VERSION/7.2.25.Final/' "$P/pom.xml"
          cd "$P"
          printf 'target/\nmigrax-ci/\n' > .gitignore
          MIGRAX_DATABASE_URL="jdbc:h2:file:$RUNNER_TEMP/db" MIGRAX_DATABASE_USER=sa \
            java -jar "$GITHUB_WORKSPACE"/target/migrax-*[0-9T].jar generate --no-input
          git init -q -b main && git add -A
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm base
          git clone -q --bare . "$RUNNER_TEMP/origin.git"
          git remote add origin "$RUNNER_TEMP/origin.git" && git fetch -q origin
          git checkout -q -b change
          echo 'ALTER TABLE customers ADD COLUMN loyalty integer NOT NULL;' \
            > src/main/resources/db/migration/0002_loyalty.sql
          git add -A && git -c user.name=ci -c user.email=ci@example.invalid commit -qm change
      - name: Run the script
        run: |
          cd "$RUNNER_TEMP/project"
          export GITLAB_CI=true CI_MERGE_REQUEST_TARGET_BRANCH_NAME=main
          export CI_PROJECT_DIR="$PWD" CI_JOB_URL=https://gitlab.example/job/1
          export MIGRAX_JAR=$(ls "$GITHUB_WORKSPACE"/target/migrax-*[0-9T].jar)
          # A lint warning alone passes, unless warnings should fail.
          sh "$GITHUB_WORKSPACE/ci/migrax-ci.sh"
          grep -q 'Entities match the migrations' migrax-ci/comment.md
          grep -q 'warning MX002' migrax-ci/comment.md
          grep -q 'gitlab.example/job/1/artifacts/file/migrax-ci/migrax-report.html' migrax-ci/comment.md
          if MIGRAX_FAIL_ON_LINT_WARNINGS=true sh "$GITHUB_WORKSPACE/ci/migrax-ci.sh"; then
            echo "Lint warnings did not fail the job" >&2; exit 1
          fi
          # An entity change without a migration fails, and the comment has the planned SQL.
          sed -i 's/public long version;/public long version;\n    public String nickname;/' \
            src/main/java/com/matrix/Customer.java
          if sh "$GITHUB_WORKSPACE/ci/migrax-ci.sh"; then
            echo "An entity change without a migration did not fail the job" >&2; exit 1
          fi
          grep -q 'Entity changes without a migration' migrax-ci/comment.md
          grep -q 'ADD COLUMN nickname' migrax-ci/comment.md

  image:
    name: Container image
    runs-on: ubuntu-latest
    needs: build
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: image-test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Retries Maven once when Maven Central fails to serve a file (.github/ci/mvn).
      - run: echo "$GITHUB_WORKSPACE/.github/ci" >> "$GITHUB_PATH"
      - run: mvn -B -q package -DskipTests -Dspotbugs.skip=true
      - name: Build the image
        run: |
          VERSION=$(mvn -q -B help:evaluate -Dexpression=project.version -DforceStdout)
          docker build --build-arg VERSION="$VERSION" -t migrax:ci .
      # Migrations only, no project: the image's own drivers, a password from a mounted file.
      - name: Migrate PostgreSQL with the image
        run: |
          mkdir -p "$RUNNER_TEMP/migrations"
          printf 'CREATE TABLE customer (id bigint PRIMARY KEY);\n' \
            > "$RUNNER_TEMP/migrations/0001_init.sql"
          printf 'image-test\n' > "$RUNNER_TEMP/db-password"
          run() {
            docker run --rm --network host -v "$RUNNER_TEMP/migrations:/migrations:ro" \
              -v "$RUNNER_TEMP/db-password:/run/secrets/db-password:ro" \
              -e MIGRAX_DATABASE_URL=jdbc:postgresql://localhost:5432/postgres \
              -e MIGRAX_DATABASE_USER=postgres \
              -e MIGRAX_DATABASE_PASSWORD_FILE=/run/secrets/db-password migrax:ci "$@"
          }
          run migrate --lock-timeout 30s
          run status | tee status.txt
          grep -q "1 applied" status.txt
