name: Docs

# Builds the documentation site on every change, and publishes it from main to the public
# repository docs-migrax/docs-migrax.github.io, served at https://migrax.org/ (the old
# https://docs-migrax.github.io/ redirects there). This repository stays private; only the
# built HTML is published.
#
# Needs the secret DOCS_DEPLOY_KEY: the private half of an SSH deploy key whose public half is
# added, with write access, to docs-migrax/docs-migrax.github.io.

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'CONTRIBUTING.md', 'CHANGELOG.md',
            'scripts/fetch-releases.py', 'scripts/build-llms-txt.py',
            'scripts/mkdocs_hooks.py', 'overrides/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'mkdocs.yml', 'README.md', 'CONTRIBUTING.md', 'CHANGELOG.md',
            'scripts/fetch-releases.py', 'scripts/build-llms-txt.py',
            'scripts/mkdocs_hooks.py', 'overrides/**', '.github/workflows/docs.yml']
  # Run by release.yml after it publishes a release, so the Download page gets the new files.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-publish
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      # Copies the release files into the site and writes the Download page.
      - run: python scripts/fetch-releases.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # --strict turns broken links and missing pages into errors.
      - run: mkdocs build --strict
      # llms.txt and llms-full.txt: the docs for AI assistants, next to the site's pages.
      - run: python scripts/build-llms-txt.py site

      - name: Publish to docs-migrax.github.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.DOCS_DEPLOY_KEY }}
          external_repository: docs-migrax/docs-migrax.github.io
          publish_branch: main
          publish_dir: ./site
          # Writes the CNAME file that keeps the custom domain; force_orphan would delete it.
          cname: migrax.org
          force_orphan: true
          commit_message: 'docs: publish ${{ github.sha }}'
