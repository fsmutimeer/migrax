quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
quarkus.datasource.username=postgres
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.devservices.enabled=false
quarkus.hibernate-orm.schema-management.strategy=validate

# A second database, migrated from db/billing (and the Java package db.billing).
quarkus.datasource.billing.db-kind=h2
quarkus.datasource.billing.jdbc.url=jdbc:h2:mem:billing;DB_CLOSE_DELAY=-1
migrax.databases.billing.placeholders.owner=billing_team
